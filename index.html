<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Squeeze</title>
    <meta
      name="description"
      content="A tiny reflex game about staying inside a shrinking window."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
    </header>
    <main>
      <h1>Squeeze</h1>
      <div class="hud">
        <span class="score" data-testid="score">0</span>
        <span class="lives" data-testid="lives" aria-label="3 lives remaining">●●●</span>
      </div>
      <div class="track" data-testid="track" aria-label="Squeeze">
        <div class="band" data-testid="band"></div>
        <div class="price" data-testid="price"></div>
      </div>
      <p class="status" data-testid="status" hidden></p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
